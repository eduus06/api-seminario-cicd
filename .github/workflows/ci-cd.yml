name: Esteira CI/CD - API Seminario

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: api-seminario-cicd
  CONTAINER_PORT: 3000

permissions:
  contents: read
  packages: write

jobs:
  testes:
    name: "1. Testes Automatizados (Req 3)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código-fonte (Requisito 1)
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências de forma limpa
        run: npm ci

      - name: Executar suíte de testes (Jest + Supertest)
        run: npm test

  build-docker:
    name: "2. Build Imagem Docker (Req 2) & Registry (Req 4)"
    needs: testes
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Definir metadados e normalizar nome da imagem em minúsculas
        id: meta
        run: |
          IMAGE_LOWER="$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "image_name=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker otimizada (Requisito 2)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.image_tag }}
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspecionar imagem Docker construída (Validação do Requisito 2)
        run: |
          echo "=== Imagens construídas no passo de Build ==="
          docker images "${{ steps.meta.outputs.image_name }}"

      - name: Autenticar no GitHub Container Registry (Requisito 4)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no Container Registry (Requisito 4)
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.meta.outputs.image_name }}:latest"
          docker push "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}"

  deploy:
    name: "3. Deploy na VM via SSH & Health Check (Req 5)"
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}
      IMAGE_NAME: ${{ needs.build-docker.outputs.image_name }}
      IMAGE_TAG: ${{ needs.build-docker.outputs.image_tag }}
    steps:
      - name: Checkout do código-fonte (obter scripts/deploy.sh)
        uses: actions/checkout@v4

      - name: Validar configuração dos secrets de deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret ${v} não configurado. Veja a seção 'Configuração do ambiente de deploy' no README."
              exit 1
            fi
          done

      - name: Configurar chave SSH de acesso à VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host vm-deploy
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Enviar script de deploy para a VM
        run: |
          ssh vm-deploy 'mkdir -p ~/api-seminario-cicd'
          scp scripts/deploy.sh vm-deploy:~/api-seminario-cicd/deploy.sh

      - name: Executar deploy na VM (docker pull do GHCR + health check + rollback)
        run: |
          ssh vm-deploy \
            "IMAGE_NAME='${IMAGE_NAME}' IMAGE_TAG='${IMAGE_TAG}' HOST_PORT='${APP_PORT}' \
             CONTAINER_NAME='${{ env.CONTAINER_NAME }}' CONTAINER_PORT='${{ env.CONTAINER_PORT }}' \
             bash ~/api-seminario-cicd/deploy.sh"

      - name: Teste de fumaça externo (acesso público à API implantada)
        run: |
          URL="http://${DEPLOY_HOST}:${APP_PORT}"
          echo "=== GET ${URL}/health ==="
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${URL}/health"; echo
          echo "=== GET ${URL}/api/info ==="
          RESP="$(curl -fsS "${URL}/api/info")"; echo "${RESP}"
          echo "${RESP}" | grep -q "\"commit\":\"${IMAGE_TAG}\"" \
            || { echo "::error::A API publicada não está rodando o commit ${IMAGE_TAG}"; exit 1; }
          echo "Versão implantada confere com o commit ${IMAGE_TAG}."

      - name: Remover chave SSH do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
